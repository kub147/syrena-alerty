<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Syrena – komunikaty RSO</title>
<style>
:root{font-family:system-ui,sans-serif;color:#1c2330;background:#f5f6f8}
body{margin:0;padding:16px}main{max-width:900px;margin:auto}
h1{font-size:1.15rem;margin:0 0 12px}.siatka{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
article{background:#fff;border-radius:8px;border-left:10px solid var(--k);padding:12px 14px}
h2{font-size:1rem;margin:0;text-transform:capitalize}.stan{font-weight:700;margin:4px 0 8px}
details{margin:6px 0}summary{cursor:pointer}small,footer{color:#556}footer{margin-top:14px;font-size:.85rem}
#cw{background:#6a3fb5;color:#fff;font-weight:700;padding:10px;border-radius:8px;margin-bottom:12px}
</style></head><body><main>
<div id="cw" hidden>ĆWICZENIE – to nie jest prawdziwy alert</div>
<h1>Komunikaty RSO: podkarpackie i lubelskie</h1><div class="siatka" id="w" aria-live="polite">Wczytywanie…</div>
<footer><p id="o"></p><p>Projekt studencki AGH. Nie zastępuje komunikatów służb. Brak komunikatu tutaj nie oznacza braku zagrożenia.
Sprawdź <a href="https://www.gov.pl/web/rcb" target="_blank" rel="noopener">RCB</a> i <a href="https://gdziesieukryc.pl" target="_blank" rel="noopener">gdziesieukryc.pl</a>. Źródło: <a href="https://komunikaty.tvp.pl" target="_blank" rel="noopener">RSO</a>.</p></footer>
</main><script>
const STANY={zagrozenie:['Zagrożenie z powietrza – znajdź bezpieczne miejsce, stosuj się do poleceń służb','#c62828'],
gotowosc:['Podniesiona gotowość – śledź komunikaty','#ef6c00'],inny:['Inny komunikat','#c9a100'],
brak_komunikatu:['Brak komunikatu w RSO','#9aa3ad'],brak_danych:['Brak danych – sprawdź RCB','#111']};
const CW=new URLSearchParams(location.search).get('cwiczenie')==='1';
const el=(t,x)=>{const e=document.createElement(t);e.textContent=x||'';return e};
const czysty=x=>new DOMParser().parseFromString(x||'','text/html').body.textContent;
function pokaz(d){
 const stary=!d||!(Date.now()-Date.parse(d.odczyt)<15*60e3);
 const w=document.getElementById('w');w.replaceChildren();
 for(const n of ['podkarpackie','lubelskie']){
  const x=(d&&d.wojewodztwa&&d.wojewodztwa[n])||{status:'brak_danych',komunikaty:[]};
  const [opis,kolor]=STANY[stary?'brak_danych':x.status]||STANY.brak_danych;
  const a=el('article');a.style.setProperty('--k',kolor);a.append(el('h2',n));
  const s=el('p',opis);s.className='stan';a.append(s);
  if(stary&&x.komunikaty.length)a.append(el('small','Poniższe komunikaty mogą być nieaktualne.'));
  for(const k of x.komunikaty){const t=el('details');t.append(el('summary',k.tytul));t.append(el('p',czysty(k.tresc)||k.skrot));t.append(el('small','Ważny: '+(k.od||'?')+' – '+(k.do||'?')));a.append(t)}
  w.append(a)}
 document.getElementById('o').textContent=d?'Ostatni odczyt: '+new Date(d.odczyt).toLocaleString('pl-PL'):'Nie udało się odczytać danych.';
}
async function odswiez(){
 if(CW){document.getElementById('cw').hidden=false;return pokaz({odczyt:new Date().toISOString(),wojewodztwa:{podkarpackie:{status:'zagrozenie',komunikaty:[{tytul:'ĆWICZENIE – przykładowy komunikat',tresc:'ĆWICZENIE. Tak wyglądałby system podczas alertu. To nie jest prawdziwy alert.',od:'ćwiczenie',do:'ćwiczenie'}]},lubelskie:{status:'gotowosc',komunikaty:[{tytul:'ĆWICZENIE – podniesiona gotowość',tresc:'ĆWICZENIE. To nie jest prawdziwy alert.',od:'ćwiczenie',do:'ćwiczenie'}]}}})}
 try{const r=await fetch('alerty.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw 0;pokaz(await r.json())}catch(e){pokaz(null)}
}
odswiez();setInterval(odswiez,60e3);
</script></body></html>
