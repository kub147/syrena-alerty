name: Alerty RSO
# GitHub uruchamia harmonogram rzadziej niż co 5 minut (zwykle co 10-17), dlatego jedno uruchomienie
# robi trzy odczyty co ok. 4 minuty. Pauza po wysłaniu pakietu: lista artefaktów odświeża się z opóźnieniem.
on:
  schedule:
    - cron: "*/5 * * * *"
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publikuj:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.p1.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: cd alerty && python3 -m unittest
      - uses: actions/configure-pages@v5
      - name: Odczyt 1
        run: |
          rm -rf strona && mkdir strona && cp alerty/index.html strona/
          python3 alerty/pobierz.py strona/alerty.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: strona
          name: strona-1
      - run: sleep 15
      - name: Publikacja 1
        id: p1
        uses: actions/deploy-pages@v4
        continue-on-error: true
        with:
          artifact_name: strona-1
      - run: sleep 210
      - name: Odczyt 2
        run: |
          rm -rf strona && mkdir strona && cp alerty/index.html strona/
          python3 alerty/pobierz.py strona/alerty.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: strona
          name: strona-2
      - run: sleep 15
      - name: Publikacja 2
        id: p2
        uses: actions/deploy-pages@v4
        continue-on-error: true
        with:
          artifact_name: strona-2
      - run: sleep 210
      - name: Odczyt 3
        run: |
          rm -rf strona && mkdir strona && cp alerty/index.html strona/
          python3 alerty/pobierz.py strona/alerty.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: strona
          name: strona-3
      - run: sleep 15
      - name: Publikacja 3
        id: p3
        uses: actions/deploy-pages@v4
        continue-on-error: true
        with:
          artifact_name: strona-3
      - name: Czy udała się choć jedna publikacja
        run: test "${{ steps.p1.outcome }}" = success -o "${{ steps.p2.outcome }}" = success -o "${{ steps.p3.outcome }}" = success
