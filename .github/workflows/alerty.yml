name: Alerty RSO
on:
  schedule:
    - cron: "*/5 * * * *"
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publikuj:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.strona.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: cd alerty && python3 -m unittest
      - run: |
          mkdir -p strona && cp alerty/index.html strona/
          python3 alerty/pobierz.py strona/alerty.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: strona
      - run: sleep 10  # lista artefaktów bywa opóźniona
      - id: strona
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - if: steps.strona.outcome == 'failure'
        run: sleep 30
      - if: steps.strona.outcome == 'failure'
        uses: actions/deploy-pages@v4
